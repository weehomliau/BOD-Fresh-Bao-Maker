<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>B.O.D 包栈：极速包点师 (防作弊加强版)</title>
    
    <link rel="icon" type="image/png" href="assets/cover.png">
    <link rel="apple-touch-icon" href="assets/cover.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#b91c1c">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      @keyframes steam-rise { 0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; } 20% { opacity: 0.5; } 100% { transform: translateY(-60px) scale(1.5) rotate(10deg); opacity: 0; } }
      @keyframes shake-hard { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
      @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes steam-pump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
      @keyframes fire-pulse { 0% { transform: scale(1); text-shadow: 0 0 2px orange; } 50% { transform: scale(1.2); text-shadow: 0 0 10px red; } 100% { transform: scale(1); text-shadow: 0 0 2px orange; } }
      @keyframes fever-bg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-steam { animation: steam-rise 2.5s ease-out infinite; }
      .animate-shake-hard { animation: shake-hard 0.5s ease-in-out infinite; }
      .animate-pop { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .animate-pump { animation: steam-pump 1s ease-in-out infinite; }
      .animate-combo { animation: fire-pulse 0.3s ease-in-out; }
      .animate-fever-bg { background-size: 200% 200%; animation: fever-bg 1s ease infinite; }
      
      .gpu-accel { transform: translate3d(0,0,0); will-change: transform; }
      
      body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      .btn-press:active { transform: scale(0.92) !important; transition: transform 0.05s; }
      
      @keyframes pleat-appear { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
      .animate-pleat { animation: pleat-appear 0.2s ease-out forwards; }
    </style>
    
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
</head>
<body class="bg-neutral-900 min-h-[100dvh] flex items-center justify-center font-sans overflow-hidden fixed inset-0">
    <div id="root" class="w-full max-w-md h-[100dvh] bg-gray-100 sm:rounded-3xl shadow-2xl relative flex flex-col"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, memo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { ChefHat, Timer, Trophy, Flame, Utensils, RotateCcw, XCircle, CheckCircle, User, ArrowLeft, Crown, Globe, Sparkles, Trash2, Loader2, Zap, Clock, Volume2, VolumeX, Download, Share, PlusSquare, Wifi, WifiOff } from 'lucide-react';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, query, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const GAME_DURATION = 90; 
        const FEVER_DURATION = 5000; 
        const MAGIC_SALT = 123456;

        // Firebase Setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyADgrOOUC0C1fCuFyjeggJCgAPYewz6AEA",
            authDomain: "bod-fresh-bao-maker.firebaseapp.com",
            projectId: "bod-fresh-bao-maker",
            storageBucket: "bod-fresh-bao-maker.firebasestorage.app",
            messagingSenderId: "326015657318",
            appId: "1:326015657318:web:40ad92d97a662e80f8d4a7",
            measurementId: "G-SYYFVWFLYN"
        };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-bod-game';

        let db = null;
        let auth = null;
        let analytics = null;
        let isFirebaseReady = false;

        try {
            const app = initializeApp(firebaseConfig);
            analytics = getAnalytics(app);
            db = getFirestore(app);
            auth = getAuth(app);
            isFirebaseReady = true;
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const getLeaderboard = async () => {
          if (isFirebaseReady && db && auth && auth.currentUser) {
            try {
                const collRef = collection(db, "artifacts", appId, "public", "data", "leaderboard");
                const querySnapshot = await getDocs(collRef);
                const rawData = querySnapshot.docs.map(doc => doc.data());
                
                rawData.sort((a, b) => b.score - a.score);

                const uniqueData = [];
                const seenNames = new Set();
                for (const entry of rawData) {
                    if (!seenNames.has(entry.name)) {
                        seenNames.add(entry.name);
                        uniqueData.push(entry);
                        if (uniqueData.length >= 30) break;
                    }
                }
                return uniqueData;
            } catch (error) { 
                console.error("Leaderboard fetch error:", error);
                return []; 
            }
          } else {
            const saved = localStorage.getItem('bod_leaderboard');
            return saved ? JSON.parse(saved) : [];
          }
        };

        const saveScoreToLeaderboard = async (name, score) => {
          const newEntry = { name, score, date: new Date().toISOString() };
          if (isFirebaseReady && db && auth && auth.currentUser) {
            try {
                const collRef = collection(db, "artifacts", appId, "public", "data", "leaderboard");
                const querySnapshot = await getDocs(collRef);
                
                let existingDocId = null;
                let currentHighest = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.name === name) {
                        existingDocId = doc.id;
                        currentHighest = data.score;
                    }
                });

                if (existingDocId) {
                    if (score > currentHighest) {
                        await updateDoc(doc(db, "artifacts", appId, "public", "data", "leaderboard", existingDocId), { score: score, date: new Date().toISOString() });
                    }
                } else {
                    await addDoc(collRef, newEntry);
                }
                return await getLeaderboard();
            } catch (error) { 
                console.error("Save score error:", error);
                return []; 
            }
          } else {
            let current = localStorage.getItem('bod_leaderboard') ? JSON.parse(localStorage.getItem('bod_leaderboard')) : [];
            const existingIdx = current.findIndex(item => item.name === name);
            if (existingIdx >= 0) {
                if (score > current[existingIdx].score) {
                    current[existingIdx].score = score;
                    current[existingIdx].date = new Date().toISOString();
                }
            } else {
                current.push(newEntry);
            }
            const updated = current.sort((a, b) => b.score - a.score).slice(0, 30);
            localStorage.setItem('bod_leaderboard', JSON.stringify(updated));
            return updated;
          }
        };

        const SafeImage = memo(({ src, alt, fallbackIcon, className }) => {
            const [status, setStatus] = useState('loading'); 
            useEffect(() => { if(src) setStatus('loading'); }, [src]);
            if (!src) return fallbackIcon;
            return (
                <div className={`relative ${className} w-full h-full flex items-center justify-center overflow-hidden gpu-accel`}>
                    <img src={src} alt={alt} loading="eager" className={`absolute inset-0 w-full h-full object-contain transition-opacity duration-500 ${status === 'loaded' ? 'opacity-100' : 'opacity-0'}`} onLoad={() => setStatus('loaded')} onError={() => setStatus('error')} />
                    {status === 'loading' && <div className="absolute inset-0 flex items-center justify-center bg-gray-100/50"><Loader2 className="animate-spin text-red-500" size={24} /></div>}
                    {status === 'error' && <div className="absolute inset-0 flex items-center justify-center">{fallbackIcon}</div>}
                </div>
            );
        });

        const IngredientBtn = memo(({ ing, onClick, shouldHighlight }) => {
            return (
                <button onPointerDown={(e) => { e.preventDefault(); onClick(ing); }} className={`flex flex-col items-center justify-center p-2 rounded-xl border transition-all duration-75 aspect-square overflow-hidden group relative btn-press bg-white/80 backdrop-blur-sm ${shouldHighlight ? 'scale-105 border-gray-300 shadow-md z-10' : 'border-gray-100 hover:bg-white scale-100'}`}>
                  <div className={`w-12 h-12 flex items-center justify-center mb-1`}><SafeImage key={ing.image} src={ing.image} alt={ing.name} className="w-full h-full object-contain" fallbackIcon={<span className="text-3xl">{ing.icon}</span>} /></div>
                  <span className={`text-xs font-medium leading-tight text-center ${shouldHighlight ? 'font-bold text-gray-800' : 'text-gray-600'}`}>{ing.name}</span>
                </button>
            );
        });

        const FoldingStage = memo(({ onComplete, playSfx }) => {
            const TARGET_CLICKS = 10; 
            const [clicks, setClicks] = useState(0);
            const [isComplete, setIsComplete] = useState(false);

            const handleTap = (e) => {
                if (isComplete) return;
                playSfx('pop');
                const newClicks = clicks + 1;
                setClicks(newClicks);

                if (newClicks >= TARGET_CLICKS) {
                    setIsComplete(true);
                    setTimeout(onComplete, 300);
                }
            };

            const progress = Math.min(100, Math.round((clicks / TARGET_CLICKS) * 100));

            return (
                <div className="w-full h-full flex flex-col items-center justify-center relative select-none">
                    <h3 className="text-gray-400 text-xs font-bold mb-6 animate-pulse tracking-widest uppercase">快速点击捏褶 ({clicks}/{TARGET_CLICKS})</h3>
                    
                    <div className="relative w-64 h-64 flex items-center justify-center">
                        <button 
                            onPointerDown={handleTap}
                            className="w-48 h-48 bg-orange-50 rounded-full border-4 border-orange-100 shadow-inner flex items-center justify-center relative overflow-hidden active:scale-95 transition-transform duration-75 outline-none touch-manipulation cursor-pointer"
                            style={{ WebkitTapHighlightColor: 'transparent' }}
                        >
                            <SafeImage src="assets/folding_bun.png" alt="Bun" className="w-full h-full object-cover opacity-90" fallbackIcon={<span className="text-6xl opacity-20">🥟</span>}/>
                            {Array.from({ length: clicks }).map((_, i) => (
                                     <div key={`pleat-${i}`} 
                                          className="absolute w-2 h-24 bg-gradient-to-b from-transparent via-orange-200/50 to-orange-300/80 origin-bottom rounded-full blur-[1px] animate-pleat"
                                          style={{ 
                                              transform: `rotate(${(i * 360 / TARGET_CLICKS)}deg) translateY(-50%)`, 
                                              bottom: '50%',
                                              left: '50%',
                                              marginLeft: '-4px',
                                              transformOrigin: 'bottom center'
                                          }}
                                     ></div>
                            ))}
                        </button>
                    </div>
                    
                    <div className="w-32 h-1.5 bg-gray-100 rounded-full mt-8 overflow-hidden">
                        <div className="h-full bg-green-500 transition-all duration-100 ease-out" style={{ width: `${progress}%` }}></div>
                    </div>
                </div>
            );
        });

        const RECIPES = [
          { id: 'kungfu_bun', name: '功夫肉包', description: 'B.O.D 镇店之宝', ingredients: ['面团', '猪肉片', '包菜', '花雕酒'], color: 'bg-orange-100', icon: <span className="text-4xl">🥋</span>, image: "assets/kungfu_bun.png", difficulty: 2 },
          { id: 'bbq_bun', name: '御品叉烧包', description: '独家秘制酱汁', ingredients: ['面团', '秘制叉烧'], color: 'bg-red-50', icon: <span className="text-4xl">🍖</span>, image: "assets/bbq_bun.png", difficulty: 1 },
          { id: 'lava_bun', name: '咸蛋流沙包', description: '爆浆口感', ingredients: ['面团', '咸蛋黄流沙'], color: 'bg-yellow-100', icon: <span className="text-4xl">🥚</span>, image: "assets/lava_bun.png", difficulty: 1 },
          { id: 'mei_cai_bun', name: '梅菜包', description: '经典客家风味', ingredients: ['面团', '梅菜'], color: 'bg-green-50', icon: <span className="text-4xl">🥬</span>, image: "assets/mei_cai_bun.png", difficulty: 1 },
          { id: 'cheese_pot', name: '香香起司窝', description: '年轻人的最爱', ingredients: ['面团', '起司碎', '台湾香肠'], color: 'bg-yellow-50', icon: <span className="text-4xl">🧀</span>, image: "assets/cheese_bun.png", difficulty: 2 },
          { id: 'red_bean_bun', name: '豆沙包', description: '经典红豆', ingredients: ['面团', '天津红豆'], color: 'bg-red-50', icon: <span className="text-4xl">🫘</span>, image: "assets/red_bean_bun.png", difficulty: 1 }
        ];

        const INGREDIENTS_POOL = [
          { id: '面团', name: '老面面团', icon: '⚪', image: "assets/dough.png" },
          { id: '秘制叉烧', name: '秘制叉烧', icon: '🍖', image: "assets/char_siu.png" },
          { id: '猪肉片', name: '上等肉片', icon: '🥩', image: "assets/pork.png" },
          { id: '包菜', name: '新鲜包菜', icon: '🥬', image: "assets/cabbage.png" },
          { id: '花雕酒', name: '陈年花雕', icon: '🍶', image: "assets/wine.png" }, 
          { id: '咸蛋黄流沙', name: '流沙馅', icon: '🥚', image: "assets/salted_egg.png" },
          { id: '梅菜', name: '梅菜', icon: '🥘', image: "assets/mei_cai.png" },
          { id: '起司碎', name: '起司碎', icon: '🧀', image: "assets/cheese.png" }, 
          { id: '台湾香肠', name: '台湾香肠', icon: '🌭', image: "assets/sausage.png" },
          { id: '天津红豆', name: '天津红豆', icon: '🫘', image: "assets/red_bean_paste.png" },
        ];

        function BODGame() {
          const [gameState, setGameState] = useState('MENU'); 
          const [score, setScore] = useState(0);
          const [shadowScore, setShadowScore] = useState(0 ^ MAGIC_SALT);

          const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
          const [currentOrder, setCurrentOrder] = useState(null);
          const [worktable, setWorktable] = useState([]); 
          const [cookingStep, setCookingStep] = useState('PREP'); 
          const [steamProgress, setSteamProgress] = useState(0); 
          const [feedback, setFeedback] = useState(null); 
          const [playerName, setPlayerName] = useState('');
          const [isScoreSaved, setIsScoreSaved] = useState(false);
          const [leaderboardData, setLeaderboardData] = useState([]);
          const [isLoadingRank, setIsLoadingRank] = useState(false);
          const [user, setUser] = useState(null);
          
          const [combo, setCombo] = useState(0); 
          const [isFever, setIsFever] = useState(false);
          const [feverClickAnim, setFeverClickAnim] = useState(null); 
          
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [showInstallModal, setShowInstallModal] = useState(false);
          const [isIOS, setIsIOS] = useState(false);
          
          const [isMuted, setIsMuted] = useState(false);

          const gameStateRef = useRef(gameState); 
          
          const bgmRef = useRef(null); 
          const victoryBgmRef = useRef(null); 
          const introRef = useRef(null); 
          const sfxPools = useRef({});

          const steamLockedRef = useRef(false);
          const timerRef = useRef(null);
          const steamTimerRef = useRef(null);
          
          const lastFeverClickTime = useRef(0);
          
          const updateScore = useCallback((increment) => {
              setScore(prev => {
                  const newScore = prev + increment;
                  setShadowScore((prev ^ MAGIC_SALT) + increment ^ MAGIC_SALT);
                  return newScore;
              });
          }, []);

          useEffect(() => {
             const initAuth = async () => {
                 if (!auth) return;
                 if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                     await signInWithCustomToken(auth, __initial_auth_token);
                 } else {
                     await signInAnonymously(auth);
                 }
             };
             initAuth();
             if(auth) {
                 const unsubscribe = onAuthStateChanged(auth, setUser);
                 return () => unsubscribe();
             }
          }, []);

          useEffect(() => {
              gameStateRef.current = gameState;
              if (analytics) {
                  logEvent(analytics, 'screen_view', {
                      firebase_screen: gameState, 
                      screen_name: gameState
                  });
              }
          }, [gameState]);

          useEffect(() => {
              const isDeviceIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
              setIsIOS(isDeviceIOS);

              const savedName = localStorage.getItem('bod_player_name');
              if (savedName) setPlayerName(savedName);

              const handleBeforeInstallPrompt = (e) => {
                  e.preventDefault();
                  setDeferredPrompt(e);
              };
              window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

              const AudioContext = window.AudioContext || window.webkitAudioContext;
              if (AudioContext) { const audioCtx = new AudioContext(); }
              
              bgmRef.current = new Audio('assets/bgm.mp3');
              bgmRef.current.loop = true;
              bgmRef.current.volume = 0.3;

              victoryBgmRef.current = new Audio('assets/victory.mp3');
              victoryBgmRef.current.loop = true;
              victoryBgmRef.current.volume = 0.4;

              introRef.current = new Audio('assets/intro.mp3');
              introRef.current.loop = true;
              introRef.current.volume = 0.4;

              const createPool = (src, size) => Array.from({length: size}, () => {
                  const a = new Audio(src);
                  a.load();
                  return a;
              });

              sfxPools.current = {
                  pop: createPool('assets/pop.mp3', 10),
                  win: createPool('assets/win.mp3', 10),
                  lose: createPool('assets/lose.mp3', 3),
              };

              const unlockAudio = () => {
                  if (bgmRef.current) {}
                  if (gameStateRef.current === 'MENU' && introRef.current && introRef.current.paused && !isMuted) {
                      introRef.current.play().catch(()=>{});
                  }
                  document.removeEventListener('click', unlockAudio);
                  document.removeEventListener('touchstart', unlockAudio);
              };
              document.addEventListener('click', unlockAudio);
              document.addEventListener('touchstart', unlockAudio);

              return () => {
                  window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                  if (bgmRef.current) { bgmRef.current.pause(); bgmRef.current = null; }
                  if (victoryBgmRef.current) { victoryBgmRef.current.pause(); victoryBgmRef.current = null; }
                  if (introRef.current) { introRef.current.pause(); introRef.current = null; }
                  document.removeEventListener('click', unlockAudio);
                  document.removeEventListener('touchstart', unlockAudio);
              };
          }, []);

          const handleInstallClick = () => {
              if (deferredPrompt) {
                  deferredPrompt.prompt();
                  deferredPrompt.userChoice.then((choiceResult) => {
                      setDeferredPrompt(null);
                      setShowInstallModal(false);
                  });
              } else {
                  setShowInstallModal(true);
              }
          };

          const handleShareClick = async () => {
              const shareData = {
                  title: 'B.O.D 包栈：极速包点师',
                  text: `我在B.O.D极速包点师挑战了 ${score} 分！快来试试你的手速！`,
                  url: window.location.href
              };

              if (navigator.share) {
                  try {
                      await navigator.share(shareData);
                  } catch (err) {
                      console.log('Share canceled');
                  }
              } else {
                  copyToClipboard(window.location.href);
              }
          };

          useEffect(() => {
              if (!bgmRef.current || !victoryBgmRef.current || !introRef.current) return;

              if (isMuted) {
                  bgmRef.current.pause();
                  victoryBgmRef.current.pause();
                  introRef.current.pause();
              } else {
                  if (gameState === 'MENU' || gameState === 'LEADERBOARD') {
                      bgmRef.current.pause();
                      victoryBgmRef.current.pause();
                      if (introRef.current.paused) {
                          introRef.current.currentTime = 0;
                          const p = introRef.current.play();
                          if (p) p.catch(()=>{});
                      }
                  } else if (gameState === 'PLAYING') {
                      introRef.current.pause();
                      victoryBgmRef.current.pause();
                      if (bgmRef.current.paused) {
                          bgmRef.current.currentTime = 0;
                          const p = bgmRef.current.play();
                          if(p) p.catch(()=>{});
                      }
                      bgmRef.current.playbackRate = isFever ? 1.5 : 1.0;

                  } else if (gameState === 'GAMEOVER') {
                      introRef.current.pause();
                      bgmRef.current.pause();
                      if (victoryBgmRef.current.paused) {
                           victoryBgmRef.current.currentTime = 0;
                           const p = victoryBgmRef.current.play();
                           if(p) p.catch(()=>{});
                      }
                  }
              }
          }, [gameState, isMuted, isFever]);

          const playSfx = useCallback((name) => {
              if (isMuted || !sfxPools.current[name]) return;
              const pool = sfxPools.current[name];
              const sound = pool.find(s => s.paused) || pool[0];
              sound.currentTime = 0;
              sound.volume = 1.0;
              sound.play().catch(() => {});
          }, [isMuted]);

          useEffect(() => {
            if (gameState === 'PLAYING' && !isFever) {
              timerRef.current = setInterval(() => {
                setTimeLeft((prev) => {
                  if (prev <= 1) {
                    endGame();
                    return 0;
                  }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => clearInterval(timerRef.current);
          }, [gameState, isFever]);

          useEffect(() => {
            if (gameState === 'LEADERBOARD') {
                if (!user && isFirebaseReady) return;
                setIsLoadingRank(true);
                getLeaderboard().then(data => {
                    setLeaderboardData(data);
                    setIsLoadingRank(false);
                });
            }
          }, [gameState, user]);

          const generateNewOrder = () => {
            const randomRecipe = RECIPES[Math.floor(Math.random() * RECIPES.length)];
            setCurrentOrder(randomRecipe);
            setWorktable([]);
            setCookingStep('PREP');
            setSteamProgress(0);
          };

          const startFeverMode = () => {
             setIsFever(true);
             showFeedback('🔥 FEVER TIME! 时间暂停!', 'success');
             setTimeout(() => {
                 setIsFever(false);
                 setTimeLeft(prev => prev + 5); 
                 showFeedback('⏱️ 时间 +5秒!', 'success');
                 generateNewOrder(); 
             }, FEVER_DURATION);
          };

          const handleFeverClick = (side, e) => {
              if(e) { e.preventDefault(); e.stopPropagation(); }
              
              const now = Date.now();
              if (now - lastFeverClickTime.current < 40) return;
              lastFeverClickTime.current = now;

              playSfx('win'); 
              updateScore(1); 
              setFeverClickAnim(side);
              setTimeout(() => setFeverClickAnim(null), 50); 
          };

          const startGame = () => {
             if (introRef.current) {
                 introRef.current.pause();
                 introRef.current.currentTime = 0;
             }
             if (analytics) logEvent(analytics, 'level_start');
             
             setScore(0);
             setShadowScore(0 ^ MAGIC_SALT);
             setCombo(0); 
             setIsFever(false);
             setTimeLeft(GAME_DURATION);
             generateNewOrder();
             setGameState('PLAYING');
             setFeedback(null);
             setIsScoreSaved(false);
          };

          const endGame = () => {
            clearInterval(timerRef.current);
            clearInterval(steamTimerRef.current);
            setIsFever(false);
            if (analytics) logEvent(analytics, 'level_end', { score: score });
            setGameState('GAMEOVER');
          };

          const handleSaveScore = async () => {
            if (window.location.protocol === 'file:') {
                showFeedback('❌ 离线环境无法上传成绩', 'error');
                return;
            }

            if (score !== (shadowScore ^ MAGIC_SALT)) {
                showFeedback('⚠️ 数据异常，操作无效', 'error');
                console.error("Integrity check failed");
                return;
            }

            if (score > 6000) {
                showFeedback('🚫 异常高分，无法上传', 'error');
                return;
            }

            if (!playerName.trim()) {
              showFeedback('✍️ 请输入名字！', 'error');
              return;
            }
            
            localStorage.setItem('bod_player_name', playerName);
            setIsLoadingRank(true);
            await saveScoreToLeaderboard(playerName, score);
            setIsScoreSaved(true);
            showFeedback('💾 成绩已保存！', 'success');
            setIsLoadingRank(false);
            setTimeout(() => setGameState('LEADERBOARD'), 1000);
          };

          const handleResetWorktable = () => {
             if (worktable.length === 0) return;
             playSfx('lose'); 
             setWorktable([]);
             setCombo(0);
             showFeedback('连击中断!', 'error');
          };

          const handleIngredientClick = (ing) => {
            if (cookingStep !== 'PREP' || isFever) return;
            if (!currentOrder.ingredients.includes(ing.id)) {
              playSfx('lose'); 
              showFeedback('❌ 食材错误！连击中断！', 'error');
              setCombo(0); setWorktable([]); return;
            }
            if (worktable.length === 0 && ing.id !== '面团') {
              playSfx('lose'); showFeedback('⚠️ 请先拿面团！', 'warning'); return;
            }
            if (ing.id === '面团' && worktable.includes('面团')) {
                showFeedback('⚠️ 已经有面团了！', 'warning'); return;
            }
            if (ing.id !== '面团' && worktable.includes(ing.id)) {
                 showFeedback('⚠️ 已经加过了！', 'warning'); return;
            }
            playSfx('pop'); 
            const newWorktable = [...worktable, ing.id];
            setWorktable(newWorktable);
            const needed = [...currentOrder.ingredients].sort();
            const current = [...newWorktable].sort();
            if (JSON.stringify(needed) === JSON.stringify(current)) {
              showFeedback('✅ 食材备齐！开始捏褶！', 'success');
              setTimeout(() => setCookingStep('FOLDING'), 150);
            }
          };

          const handleFoldComplete = useCallback(() => {
            setCookingStep('STEAMING');
            showFeedback('🥟 造型完美！放入蒸笼！', 'success');
            startSteaming();
          }, []);

          const startSteaming = () => {
            if (steamTimerRef.current) clearInterval(steamTimerRef.current);
            steamLockedRef.current = false;
            let progress = 0;
            const difficultySpeed = 2 + Math.floor(score / 500) * 0.3;
            steamTimerRef.current = setInterval(() => {
              progress += difficultySpeed; 
              setSteamProgress(progress);
              if (progress > 120) { 
                clearInterval(steamTimerRef.current);
                handleSteamResult(false, '🔥 蒸糊了！太久了！');
              }
            }, 50);
          };

          const handleStopSteam = () => {
            if (steamLockedRef.current) return;
            steamLockedRef.current = true;
            clearInterval(steamTimerRef.current);
            if (steamProgress >= 80 && steamProgress <= 100) {
              handleSteamResult(true, '✨ 完美出炉！');
            } else if (steamProgress < 80) {
              handleSteamResult(false, '❄️ 还没熟！里面是生的！');
            } else {
              handleSteamResult(false, '🔥 蒸过头了！皮老了！');
            }
          };

          const handleSteamResult = (success, msg) => {
            if (success) {
              playSfx('win'); 
              const newCombo = combo + 1;
              setCombo(newCombo);
              const points = 100 + Math.floor(timeLeft / 10);
              const comboBonus = Math.floor(points * (newCombo * 0.1));
              const totalPoints = points + comboBonus;
              
              updateScore(totalPoints);

              showFeedback(`${msg} +${totalPoints} (连击 x${newCombo})`, 'success');
              if (newCombo > 0 && newCombo % 5 === 0) {
                  setTimeout(startFeverMode, 500); 
              } else {
                  setTimeout(generateNewOrder, 600);
              }
            } else {
              playSfx('lose'); 
              setCombo(0); 
              showFeedback(msg + ' 连击中断', 'error');
              setTimeLeft(prev => Math.max(0, prev - 5));
              if (steamTimerRef.current) clearInterval(steamTimerRef.current);
              setTimeout(() => {
                setWorktable([]);
                setCookingStep('PREP');
                setSteamProgress(0);
              }, 1000);
            }
          };

          const showFeedback = (msg, type) => {
            setFeedback({ msg, type });
            setTimeout(() => setFeedback(null), 1500);
          };

          const getFeedbackColor = () => {
            if (!feedback) return '';
            if (feedback.type === 'error') return 'bg-red-500';
            if (feedback.type === 'success') return 'bg-green-500';
            return 'bg-yellow-500';
          };

          const copyToClipboard = (code) => {
              navigator.clipboard.writeText(code).then(() => {
                  showFeedback(`已复制: ${code}`, 'success');
              });
          };

          if (gameState === 'MENU') {
            return (
              <div className="h-full w-full flex flex-col items-center justify-between p-6 font-sans relative overflow-hidden bg-orange-50">
                <div className="absolute top-4 right-4 z-30">
                    <button onClick={() => setIsMuted(!isMuted)} className="p-2 rounded-full bg-white/30 backdrop-blur text-red-800 shadow-sm hover:bg-white/50 transition-colors">
                        {isMuted ? <VolumeX size={20} /> : <Volume2 size={20} />}
                    </button>
                </div>

                <div className="absolute inset-0 opacity-10 pointer-events-none" style={{backgroundImage: 'radial-gradient(#fbbf24 2px, transparent 2px)', backgroundSize: '30px 30px'}}></div>

                <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm z-10 animate-pop min-h-0">
                    <div className="w-full flex-1 min-h-0 mb-6 relative flex items-center justify-center z-10">
                        <div className="relative w-full h-full flex justify-center items-center">
                            <SafeImage 
                                src="assets/cover.png" 
                                alt="B.O.D Game Cover" 
                                className="max-h-full max-w-full object-contain drop-shadow-2xl" 
                                fallbackIcon={
                                    <div className="text-center p-8 bg-white/80 backdrop-blur rounded-3xl shadow-xl border-4 border-orange-200">
                                            <ChefHat size={80} className="text-red-600 mx-auto mb-4" />
                                            <h1 className="text-3xl font-black text-red-800">B.O.D 包栈</h1>
                                            <p className="text-orange-600 font-bold mt-2">极速包点师</p>
                                    </div>
                                }
                            />
                        </div>
                    </div>

                    <div className="w-full space-y-4 px-4 shrink-0 z-10">
                        <button onClick={startGame} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 px-6 rounded-2xl text-xl shadow-[0_6px_0_#991b1b] active:shadow-none active:translate-y-1.5 transition-all flex items-center justify-center gap-3 border-2 border-red-700"><Utensils className="animate-bounce" size={24} /> 开始制作</button>
                        <button onClick={() => setGameState('LEADERBOARD')} className="w-full bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-bold py-3 px-6 rounded-2xl text-lg shadow-[0_6px_0_#ca8a04] active:shadow-none active:translate-y-1.5 transition-all flex items-center justify-center gap-2 border-2 border-yellow-500"><Trophy size={20} /> 大师排行榜</button>
                        <div className="flex gap-3">
                            <button onClick={handleShareClick} className="flex-1 bg-white/80 hover:bg-white text-neutral-800 font-bold py-3 px-2 rounded-2xl text-lg shadow-[0_6px_0_#d4d4d4] active:shadow-none active:translate-y-1.5 transition-all flex items-center justify-center gap-2 border-2 border-gray-300"><Share size={20} /> 分享</button>
                            <button onClick={handleInstallClick} className="flex-1 bg-white/80 hover:bg-white text-neutral-800 font-bold py-3 px-2 rounded-2xl text-lg shadow-[0_6px_0_#d4d4d4] active:shadow-none active:translate-y-1.5 transition-all flex items-center justify-center gap-2 border-2 border-gray-300"><Download size={20} /> 添加主屏</button>
                        </div>
                    </div>
                </div>
                <div className="text-orange-900/30 text-[10px] font-black tracking-widest mt-4 z-10 shrink-0 flex flex-col items-center gap-0.5"><span>Dev by Weehom Liau • V2.0 (Season 2)</span></div>
                {showInstallModal && (<div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={() => setShowInstallModal(false)}><div className="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl"><button onClick={() => setShowInstallModal(false)} className="absolute top-4 right-4 text-gray-400"><XCircle size={24} /></button><h3 className="text-xl font-black text-gray-800 mb-4 flex items-center gap-2"><Download className="text-red-600" size={24}/> 安装游戏</h3>{isIOS ? (<div className="space-y-4 text-gray-600"><p className="font-bold text-black">📱 在 iPhone/iPad 上：</p><ol className="list-decimal list-inside space-y-3 text-sm"><li className="flex items-start gap-2"><span className="mt-0.5">点击浏览器底部的</span><span className="inline-flex items-center justify-center bg-gray-100 p-1 rounded border"><Share size={14}/></span><span>分享按钮</span></li><li className="flex items-start gap-2"><span className="mt-0.5">向下滑动，选择</span><span className="inline-flex items-center gap-1 font-bold text-black bg-gray-100 px-2 py-0.5 rounded border"><PlusSquare size={14}/> 添加到主屏幕</span></li></ol></div>) : (<div className="space-y-4 text-gray-600"><p className="font-bold text-black">📱 在 Android 浏览器上：</p><ol className="list-decimal list-inside space-y-2 text-sm"><li>点击右上角的菜单图标 (⋮)</li><li>选择 <strong>安装应用</strong> 或 <strong>添加到主屏幕</strong></li></ol></div>)}<button onClick={() => setShowInstallModal(false)} className="w-full mt-6 bg-red-600 text-white font-bold py-3 rounded-xl">知道了</button></div></div>)}
              </div>
            );
          }

          if (gameState === 'LEADERBOARD') {
            return (
              <div className="h-full w-full flex flex-col items-center p-4 bg-neutral-900 text-white overflow-hidden">
                 <div className="w-full max-w-md mt-4 animate-pop flex flex-col h-full">
                   <div className="flex items-center justify-between mb-4 shrink-0">
                      <button onClick={() => setGameState('MENU')} className="bg-neutral-800 p-2 rounded-full hover:bg-neutral-700 transition-colors"><ArrowLeft size={20} /></button>
                      <h2 className="text-xl font-bold text-yellow-400 flex items-center gap-2"><Trophy className="text-yellow-400" size={20} /> 包点大师榜</h2>
                      <div className="w-9"></div>
                   </div>
                   <div className="text-center mb-2 text-[10px] text-gray-400 shrink-0">
                        {isFirebaseReady && user ? (
                            <span className="text-green-400 flex items-center justify-center gap-1"><Wifi size={10}/> 全球联网模式 (第二赛季)</span>
                        ) : (
                            <span className="text-gray-500 flex items-center justify-center gap-1"><WifiOff size={10}/> 离线模式 / 连接中...</span>
                        )}
                   </div>
                   <div className="bg-white text-neutral-900 rounded-xl shadow-xl overflow-hidden flex-1 overflow-y-auto">
                      <div className="bg-red-600 p-3 text-white font-bold grid grid-cols-12 text-xs text-center sticky top-0 z-10"><div className="col-span-2">排名</div><div className="col-span-6 text-left pl-4">包点师</div><div className="col-span-4">分数</div></div>
                      {isLoadingRank ? (<div className="p-8 text-center text-gray-500 flex flex-col items-center"><div className="animate-spin rounded-full h-6 w-6 border-b-2 border-red-600 mb-2"></div>读取中...</div>) : leaderboardData.length === 0 ? (<div className="p-8 text-center text-gray-400 text-sm">暂无记录，快去挑战吧！</div>) : (<div>{leaderboardData.map((entry, index) => (<div key={index} className={`grid grid-cols-12 items-center p-3 border-b text-center text-sm ${index < 3 ? 'bg-yellow-50' : ''}`}><div className="col-span-2 font-bold flex justify-center">{index === 0 && <Crown size={16} className="text-yellow-500 animate-bounce" fill="currentColor" />}{index === 1 && <Crown size={16} className="text-gray-400" fill="currentColor" />}{index === 2 && <Crown size={16} className="text-orange-400" fill="currentColor" />}{index > 2 && <span className="text-gray-500 text-xs">#{index + 1}</span>}</div><div className="col-span-6 text-left pl-4 font-bold text-gray-800 truncate">{entry.name}</div><div className="col-span-4 font-mono font-bold text-red-600">{entry.score}</div></div>))}</div>)}
                   </div>
                 </div>
              </div>
            );
          }

          if (gameState === 'GAMEOVER') {
            return (
              <div className="h-full w-full flex flex-col items-center justify-center p-4 bg-neutral-900 text-white">
                <div className="bg-white text-neutral-900 p-6 rounded-3xl shadow-2xl max-w-sm w-full text-center border-t-8 border-red-600 animate-pop relative">
                  <div className="relative inline-block"><Trophy size={48} className="mx-auto text-yellow-500 mb-2" />{score > 500 && <Sparkles className="absolute -top-2 -right-4 text-yellow-400 animate-pulse" />}</div>
                  <h2 className="text-2xl font-bold mb-1">营业结束</h2>
                  <p className="text-gray-500 mb-4 text-sm">本次得分</p>
                  <div className="text-5xl font-black text-red-600 mb-2 font-mono">{score}</div>
                  {combo > 1 && <div className="text-orange-500 font-bold mb-4 flex items-center justify-center gap-1 animate-combo"><Flame size={16} /> 最大连击: {combo}</div>}
                  {!isScoreSaved ? (
                    <div className="mb-6"><p className="text-xs text-gray-500 mb-2">输入名字保存到排行榜</p><div className="flex gap-2"><div className="relative flex-1"><User className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={16} /><input type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="您的名字" className="w-full pl-9 pr-3 py-2 border-2 border-gray-200 rounded-xl focus:border-red-500 outline-none font-bold text-sm transition-all focus:ring-2 focus:ring-red-200" maxLength={10} /></div><button onClick={handleSaveScore} disabled={isLoadingRank} className={`bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-xl flex items-center transition-all active:scale-95 ${isLoadingRank ? 'opacity-50 cursor-not-allowed' : ''}`}>{isLoadingRank ? '...' : '保存'}</button></div></div>
                  ) : (<div className="mb-8 p-3 bg-green-100 text-green-700 rounded-xl font-bold flex items-center justify-center gap-2 animate-in fade-in"><CheckCircle size={20} /> 成绩已上传</div>)}
                  <div className="grid grid-cols-2 gap-3"><button onClick={() => setGameState('LEADERBOARD')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95"><Trophy size={18}/> 排行榜</button><button onClick={startGame} className="bg-yellow-500 hover:bg-yellow-400 text-red-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95"><RotateCcw size={18}/> 再玩一次</button></div>
                  <button onClick={() => setGameState('MENU')} className="w-full mt-3 text-gray-400 hover:text-gray-600 text-sm font-medium py-2 transition-colors">返回主菜单</button>
                </div>
              </div>
            );
          }

          if (!currentOrder && gameState === 'PLAYING') return <div className="h-full flex items-center justify-center bg-gray-100">准备中...</div>;

          return (
            <div className={`h-full w-full flex flex-col font-sans overflow-hidden ${isFever ? 'animate-fever-bg bg-gradient-to-br from-red-600 via-yellow-500 to-red-600' : ''}`}>
              
              <div className="absolute inset-0 z-0 opacity-20 pointer-events-none">
                   <SafeImage 
                       src="assets/bg.png" 
                       alt="" 
                       className="w-full h-full object-cover"
                       fallbackIcon={<div className="w-full h-full bg-orange-50"></div>}
                   />
              </div>

              <div className={`text-white px-3 py-1 flex flex-col shadow-md z-10 transition-colors duration-500 shrink-0 relative ${isFever ? 'bg-transparent' : (timeLeft < 10 ? 'bg-red-800 animate-shake-hard' : 'bg-red-700')}`}>
                <div className="flex justify-between items-center h-8">
                    <div className="flex items-center gap-2 font-bold text-base">
                        <button onClick={() => setIsMuted(!isMuted)} className="p-1 rounded-full hover:bg-white/20 transition-colors">{isMuted ? <VolumeX size={18} /> : <Volume2 size={18} />}</button>
                        <div className={`p-0.5 rounded-lg transition-colors ${isFever ? 'bg-white/20' : (timeLeft < 10 ? 'bg-red-900' : 'bg-red-800')}`}><Timer size={16}/></div>
                        <span className={`${timeLeft < 10 ? 'text-yellow-300 scale-110 font-black' : ''} transition-all flex items-center gap-1`}>{isFever ? <span className="animate-pulse"><Clock size={14}/> PAUSED</span> : `${timeLeft}s`}</span>
                    </div>
                    {isFever ? (<div className="font-black text-xl text-yellow-200 animate-pulse flex items-center gap-1"><Zap className="fill-yellow-200" size={20} /> FEVER MODE!</div>) : (<div className="flex items-center gap-4">{combo > 1 && <div className="font-bold text-yellow-300 flex items-center gap-1 animate-combo text-sm"><Flame size={14} className="fill-yellow-300"/> {combo}</div>}<div className="font-black text-lg text-yellow-400 flex items-center gap-1">{score}</div></div>)}
                </div>
                <div className="w-full h-1 bg-black/20 rounded-full overflow-hidden"><div className={`h-full transition-all duration-1000 ease-linear ${isFever ? 'bg-white' : (timeLeft < 10 ? 'bg-yellow-400' : 'bg-yellow-300')}`} style={{ width: `${(timeLeft / GAME_DURATION) * 100}%` }}></div></div>
              </div>

              {isFever ? (
                  <div className="flex-1 flex flex-col items-center justify-center p-4 gap-6 animate-pop gpu-accel relative z-10">
                      <div className="text-white/90 text-center text-sm font-bold tracking-widest mb-2">疯狂交替点击！+1分</div>
                      <div className="flex gap-4 w-full h-64">
                          <button 
                            onPointerDown={(e) => handleFeverClick('left', e)} 
                            className={`flex-1 rounded-3xl shadow-xl border-b-8 active:border-b-0 active:translate-y-2 transition-all duration-75 flex flex-col items-center justify-center gap-2 group btn-press active:scale-90 ${feverClickAnim === 'left' ? 'bg-gray-200 border-gray-300' : 'bg-white border-gray-200'}`}
                          >
                            <span className="text-6xl group-active:scale-125 transition-transform">🥟</span><span className="text-2xl font-black text-orange-600">捏包</span>
                          </button>
                          <button 
                            onPointerDown={(e) => handleFeverClick('right', e)} 
                            className={`flex-1 rounded-3xl shadow-xl border-b-8 active:border-b-0 active:translate-y-2 transition-all duration-75 flex flex-col items-center justify-center gap-2 group btn-press active:scale-90 ${feverClickAnim === 'right' ? 'bg-gray-200 border-gray-300' : 'bg-white border-gray-200'}`}
                          >
                            <span className="text-6xl group-active:scale-125 transition-transform">♨️</span><span className="text-2xl font-black text-red-600">蒸包</span>
                          </button>
                      </div>
                      <div className="text-4xl font-black text-yellow-300 drop-shadow-lg animate-bounce">SCORE: {score}</div>
                  </div>
              ) : (
                  <>
                      <div className="bg-white p-4 border-b border-gray-200 relative z-10 shadow-sm shrink-0">
                        <div className="flex items-center gap-4">
                          <div className="w-28 h-28 min-w-[7rem] rounded-xl flex items-center justify-center text-5xl shadow-inner border border-orange-200 overflow-hidden relative group">
                            <SafeImage src={currentOrder.image} alt={currentOrder.name} className="w-full h-full object-contain transition-transform group-hover:scale-110 drop-shadow-xl" fallbackIcon={currentOrder.icon} />
                          </div>
                          <div className="flex-1 min-w-0"> 
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-xs font-bold text-red-600 uppercase tracking-wider flex items-center gap-1"><span className="text-lg">🔔</span> 订单 Order <span className="text-green-600 ml-1">🌿</span></span>
                            </div>
                            <h3 className="text-2xl font-black text-gray-800 mb-2 truncate leading-tight">{currentOrder.name}</h3>
                            <div className="flex flex-wrap gap-1.5 pl-1">
                              {currentOrder.ingredients.map((ingName, idx) => {
                                 const isCollected = worktable.includes(ingName);
                                 const ingData = INGREDIENTS_POOL.find(p => p.id === ingName);
                                 return (<div key={idx} className={`relative flex items-center gap-1.5 px-2 py-1 rounded border-2 transition-all ${isCollected ? 'bg-green-100 border-green-500 text-green-800 scale-105' : 'bg-gray-50 border-gray-300 border-dashed text-gray-400'}`}><span className="text-sm">{ingData?.icon}</span><span className="text-xs font-bold">{ingName}</span>{isCollected && <CheckCircle size={10} className="absolute -top-1.5 -right-1.5 text-green-500 rounded-full" />}</div>);
                              })}
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="flex-1 relative overflow-y-auto flex flex-col z-10">
                        {feedback && (<div className={`absolute top-4 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-lg text-white font-bold flex items-center gap-2 animate-bounce ${getFeedbackColor()}`}>{feedback.type === 'success' ? <CheckCircle size={20}/> : <XCircle size={20}/>}{feedback.msg}</div>)}
                        <div className="flex-1 flex flex-col items-center justify-center p-2 transition-all perspective-[1000px] h-full min-h-[300px]">
                          {cookingStep === 'PREP' && (
                            <div className="relative w-full flex flex-col items-center justify-evenly h-full">
                                <div className="relative">
                                    <div className="relative w-40 h-40 bg-white rounded-full border-4 border-gray-200 shadow-xl flex items-center justify-center animate-pop shrink-0 gpu-accel">
                                        {worktable.includes('面团') && <div className="absolute w-32 h-32 bg-orange-50 rounded-full border border-orange-100 shadow-inner animate-pop"></div>}
                                        {worktable.slice(1).map((ing, i) => {
                                            const ingredient = INGREDIENTS_POOL.find(p => p.id === ing);
                                            return (<div key={i} className="absolute text-3xl animate-pop flex items-center justify-center" style={{ transform: `translate(${Math.random()*20-10}px, ${Math.random()*20-10}px)` }}><SafeImage src={ingredient.image} alt={ingredient.name} className="w-8 h-8 object-contain drop-shadow-md" fallbackIcon={<span className="text-xl">{ingredient.icon}</span>} /></div>);
                                        })}
                                    </div>
                                    {worktable.length > 0 && (<button onClick={handleResetWorktable} className="absolute -right-4 -top-2 bg-red-100 hover:bg-red-200 text-red-600 p-2 rounded-full border-2 border-red-200 shadow-md transition-all active:scale-90" title="清空工作台"><Trash2 size={16} /></button>)}
                                </div>
                            </div>
                          )}

                          {cookingStep === 'FOLDING' && <FoldingStage onComplete={handleFoldComplete} playSfx={playSfx} />}

                          {cookingStep === 'STEAMING' && (
                            <div className="flex flex-col items-center w-full justify-center h-full">
                               <div className="relative w-64 h-64 flex items-center justify-center">
                                  <div className="absolute -top-10 left-1/2 transform -translate-x-1/2 pointer-events-none z-10 w-full flex justify-center">
                                             <div className="text-5xl opacity-0 animate-steam absolute" style={{animationDelay: '0s'}}>☁️</div>
                                             <div className="text-4xl opacity-0 animate-steam absolute -left-8 top-4" style={{animationDelay: '0.8s'}}>☁️</div>
                                             <div className="text-4xl opacity-0 animate-steam absolute left-8 top-4" style={{animationDelay: '1.6s'}}>☁️</div>
                                  </div>
                                  <div className="w-full h-full relative animate-pump gpu-accel">
                                     <SafeImage src="./assets/steamer.png" alt="Steamer" className="w-full h-full object-contain" fallbackIcon={<div className="w-48 h-40 bg-gradient-to-b from-orange-100 to-orange-300 rounded-[20px] border-b-8 border-orange-400 relative flex items-center justify-center"><div className="absolute -top-8 left-0 w-full h-16 bg-orange-200 rounded-[50%] border-4 border-orange-300 shadow-inner flex items-center justify-center"><span className="text-6xl">♨️</span></div></div>} />
                                  </div>
                                  <div className="absolute right-2 bottom-4 w-6 h-40 bg-gray-200 rounded-full border-2 border-gray-300 shadow-xl overflow-hidden backdrop-blur-sm bg-opacity-90 z-20">
                                        <div className="absolute right-0 top-[20%] w-full h-0.5 bg-green-500 z-20 shadow-[0_0_4px_rgba(34,197,94,0.8)]"></div>
                                        <div className="absolute right-0 top-[0%] w-full h-0.5 bg-red-500 z-20"></div>
                                        <div className="absolute bottom-0 w-full bg-gradient-to-t from-blue-500 via-blue-400 to-red-500 transition-all duration-75" style={{ height: `${steamProgress}%` }}></div>
                                        <div className="absolute top-0 left-1 w-1.5 h-full bg-white opacity-30 rounded-full"></div>
                                        <div className="absolute right-0 top-[10%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[30%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[40%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[50%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[60%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[70%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[80%] w-1.5 h-px bg-gray-400"></div>
                                        <div className="absolute right-0 top-[90%] w-1.5 h-px bg-gray-400"></div>
                                  </div>
                               </div>
                               <button onMouseDown={handleStopSteam} onTouchStart={handleStopSteam} className="mt-8 bg-gradient-to-r from-red-600 to-red-500 text-white font-bold py-3 px-10 rounded-full text-lg shadow-[0_4px_0_#991b1b] active:shadow-none active:translate-y-1 transition-all">立即出炉!</button>
                               <p className="mt-2 text-[10px] text-gray-500 font-bold">绿色刻度点击</p>
                            </div>
                          )}
                        </div>

                        {cookingStep === 'PREP' && (
                          <div className="bg-white p-2 pb-4 rounded-t-2xl shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-10 animate-in slide-in-from-bottom duration-500 shrink-0">
                            <h4 className="text-[10px] font-bold text-gray-400 mb-1.5 uppercase text-center">点击添加食材 Ingredients</h4>
                            <div className="grid grid-cols-5 gap-2 px-1">
                              {INGREDIENTS_POOL.map((ing) => {
                                const isNeeded = currentOrder.ingredients.includes(ing.id);
                                const isAdded = worktable.includes(ing.id);
                                const isNextStepDough = worktable.length === 0 && ing.id === '面团';
                                const isNextStepIngredient = worktable.length > 0 && isNeeded && !isAdded;
                                const shouldHighlight = isNextStepDough || isNextStepIngredient;

                                return (
                                    <IngredientBtn 
                                        key={ing.id} 
                                        ing={ing} 
                                        onClick={handleIngredientClick} 
                                        shouldHighlight={shouldHighlight}
                                    />
                                )})}
                            </div>
                          </div>
                        )}
                      </div>
                  </>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BODGame />);
    </script>
</body>
</html>
